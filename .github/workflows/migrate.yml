name: Migrate Lovable Supabase

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # retry pending migrations every six hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOVABLE_DB_MIGRATION_URL: ${{ secrets.LOVABLE_DB_MIGRATION_URL || secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
      REQUIRE_DB_MIGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install migrate deps
        run: npm ci --ignore-scripts

      - name: Run drizzle migrations (Lovable)
        run: node scripts/migrate.mjs

      - name: Verify tables
        run: |
          node -e "
          import postgres from 'postgres';
          const sql = postgres(process.env.LOVABLE_DB_MIGRATION_URL, {max:1});
          const checks = [
            \"select 1 where to_regclass('public.profiles') is not null\",
            \"select 1 where to_regclass('public.invitation_cards') is not null\",
            \"select proname from pg_proc where proname='enforce_invitation_card_limit'\",
            \"select * from pg_policies where tablename='invitation_cards' and policyname='Anyone can view published invitations'\",
            \"select column_name from information_schema.columns where table_name='invitation_cards' and column_name='expires_at'\",
            \"select proname from pg_proc where proname='delete_expired_invitations'\",
            \"select 1 where to_regprocedure('public.register_username(text,text)') is not null\",
            \"select 1 where to_regprocedure('public.username_login_address(text,text)') is not null\",
            \"select 1 where not exists (select 1 from pg_policies where schemaname='public' and tablename='profiles' and policyname='Anyone can view profiles')\",
            \"select 1 where not has_table_privilege('anon','public.profiles','SELECT')\",
            \"select 1 where not has_table_privilege('anon','public.wedding_rsvps','SELECT')\",
            \"select 1 where not exists (select 1 from pg_policies where schemaname='public' and tablename='wedding_photos' and cmd in ('UPDATE','DELETE'))\",
          ];
          for (const q of checks){
            const r = await sql.unsafe(q);
            console.log(q, '→', r.length ? 'OK' : 'MISSING', r[0]||'');
            if (!r.length) process.exit(1);
          }
          await sql.end();
          console.log('All migration checks passed ✓');
          "

      - name: Cleanup expired invitations (auto-delete after wedding)
        run: |
          node scripts/cleanup-expired.mjs

      - name: Report migration status
        if: always()
        env:
          MIGRATION_STATUS: ${{ job.status }}
        run: |
          echo "## Database migration: $MIGRATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Runs after every push/merge to main and retries every six hours." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$LOVABLE_DB_MIGRATION_URL" ]; then
            echo "Blocked: no database connection secret is configured. SQL cannot execute without authorized database access." >> "$GITHUB_STEP_SUMMARY"
          fi
